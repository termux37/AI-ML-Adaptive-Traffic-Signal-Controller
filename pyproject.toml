[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-traffic-control-system"
version = "1.0.0"
description = "AI & ML Based Adaptive Traffic Control System"
authors = [{ name = "Research Team" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "traffic-control",
    "reinforcement-learning",
    "deep-q-networks",
    "sumo",
    "computer-vision",
    "yolov8",
    "max-pressure",
    "intelligent-transportation-systems"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "traci>=1.20",
    "sumolib>=1.20",
    "torch>=2.0.0",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.0.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/termux37/AI-ML-Adaptive-Traffic-Signal-Controller"
Repository = "https://github.com/termux37/AI-ML-Adaptive-Traffic-Signal-Controller.git"
Changelog = "https://github.com/termux37/AI-ML-Adaptive-Traffic-Signal-Controller/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
